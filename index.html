<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BestellAPP</title>
    <link rel="stylesheet" href="./CSS/basket.css">
    <link rel="stylesheet" href="./CSS/main.css">
    <link rel="stylesheet" href="./CSS/menu.css">
    <link rel="stylesheet" href="./CSS/fonts.css">
    <link rel="stylesheet" href="./CSS/hero.css">
    <link rel="stylesheet" href="./CSS/header.css">
    <link rel="stylesheet" href="./style.css">

    <script defer src="./Javascript/menu_jason.js"></script>
    <script defer src="./Javascript/template.js"></script>
    <script defer  src="./script.js"></script>
</head>
<body onload="init()">
    <header>
        <img src="./assets/img/header-logo.png" alt="logo">
        <img src="./assets/img/menu.png" alt="menü">
    </header>
    <main>
        <section class="hero">
            <div class="hero-banner">
                <img class="hero-logo" src="./assets/img/hero-logo.png" alt="hero-Bild">
                <img class="hero-burger-logo" src="./assets/img/burger-logo.png" alt="Burger-Bild">
            </div>
            <div class="hero-information-box">
                <div class="hero-info">
                    <img src="./assets/img/BurgerHouse.png" alt="Überschrift Logo">
                    <img class="recision-pic" src="./assets/img/recision-pic.png" alt="Rezission Bild">
                </div>
                    <p class="hero-text">The best of Burgers, Pizza, all in one great place.</p>
            </div>
        </section>
         <div class="menu-headline">
                <img class="menu-icon-burger-pic" src="./assets/icons/burger-pic.png" alt="Burger">
                <p>Burger & Sandwiches</p>
            </div>
        <div class="content">
            <div class="menu-column">
        <section class="burger-menu">
            <div class="menu-wrapper" id="burgerMenu"></div>
        </section>
        <section class="pizza-menu">
                <div class="menu-headline">
                    <img class="menu-icon-pizza-pic" src="./assets/icons/pizza-pic.png" alt="Pizza">
                    <p>Pizza (30cm)</p>
                </div>
                <div class="menu-wrapper pizza-wrapper" id="pizzaMenu"></div>
            </section>
            </div>
        <section class="basket-wrapper">
            <div class="basket-sticky">
                <h2>Your Basket</h2>
                <div id="basketContent" class="basket-content"></div>
                <div id="basketSummary" class="basket-summary"></div>
            </div>
        </section>
        </div>
    </main>


    
</body>
</html>
